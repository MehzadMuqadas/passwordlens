[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "passwordlens"
version = "0.1.0"
description = "Explainable password security analyzer"
requires-python = ">=3.10"

[project.scripts]
passwordlens = "passwordlens.main:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]